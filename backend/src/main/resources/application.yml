server:
  port: 8080

spring:
  application:
    name: supportos-backend
  datasource:
    url: jdbc:h2:mem:supportosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# SupportOS Security & Multi-Tenancy Configuration
supportos:
  security:
    jwt-secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    jwt-expiration-ms: 86400000 # 24 hours
  ai:
    gemini-api-key: ${GEMINI_API_KEY:demo-key}
    default-model: gemini-2.5-flash
    temperature: 0.2
    max-tokens: 1024
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
